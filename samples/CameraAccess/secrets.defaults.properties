# Fallback used when local.properties has no MAPS_API_KEY.
# This exact sentinel value is what the app checks for to decide the map cannot be shown; it renders
# an explanatory panel instead of a blank grey square, and the rest of the screen keeps working.
#
# To get a real key: Google Cloud Console -> enable "Maps SDK for Android" -> create an
# Android-restricted key (package com.meta.wearable.dat.externalsampleapps.cameraaccess + your SHA-1),
# then add MAPS_API_KEY=... to local.properties (git-ignored, never commit it).
MAPS_API_KEY=MISSING_MAPS_API_KEY
